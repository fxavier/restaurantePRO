# Frontend CI (ADR 0043): lint, type check, unit and component tests, and build for every package and app, plus the
# OpenAPI snapshot drift check (ADR 0042), on every pull request that touches the frontend or the backend (whose
# controllers and DTOs are the contract the snapshot records).
#
# Then the Playwright end-to-end job against the real stack (deploy/e2e: PostgreSQL, Keycloak, the backend, the BFF and
# both SPAs behind their origins, ADR 0041), with its own seeded data per run.
# The backend's own test suite runs in backend.yml (ADR 0043, amended 2026-11-23).
name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "bff/**"
      - "deploy/e2e/**"
      - "deploy/keycloak/**"
      - "deploy/keycloak-*.sh"
      - "deploy/Dockerfile*"
      - "deploy/postgres/provision*"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "bff/**"
      - "deploy/e2e/**"
      - "deploy/keycloak/**"
      - "deploy/keycloak-*.sh"
      - "deploy/Dockerfile*"
      - "deploy/postgres/provision*"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned by its full commit SHA (FE-F05): a tag can be moved, a commit cannot. The comment names the
# release that SHA is; to update, resolve the new tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (and, for
# an annotated tag, its `git/tags/<sha>` object) and change both.

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs the pnpm version pinned in frontend/package.json ("packageManager").
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Also generates packages/api-client/src/schema.d.ts from the committed snapshot (its "prepare" script).
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  openapi-snapshot:
    name: OpenAPI snapshot drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # The Maven distribution the wrapper downloads is not in setup-java's cache; a Maven Central hiccup on that one
      # download failed this job twice (FE-F31). Cache it by the wrapper's pinned version.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      # Fails when frontend/packages/api-client/openapi.json differs from what the backend code produces, naming the
      # first differing line. Needs Docker for the Testcontainers database, which the hosted runner provides.
      - run: ./mvnw -B -ntp test -Dtest=OpenApiSnapshotTest

  e2e:
    name: end-to-end (real stack)
    needs: checks
    runs-on: ubuntu-latest # Docker and Compose v2 are on the hosted runner
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # The backend and BFF images, built here rather than by Compose so that their layers come from the GitHub Actions
      # cache (FE-F31): an unchanged backend or BFF is not rebuilt, and its Maven wrapper and dependencies are not
      # downloaded again. Same Dockerfiles, contexts and tags as deploy/e2e/compose.yaml; loaded into the runner's
      # Docker, which `stack.sh up` then starts as they are (E2E_SKIP_IMAGE_BUILD=1).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: deploy/Dockerfile
          build-contexts: deploy=deploy
          tags: restaurantpro-backend:e2e
          load: true
          cache-from: type=gha,scope=e2e-backend
          cache-to: type=gha,scope=e2e-backend,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: bff
          file: deploy/Dockerfile.bff
          tags: restaurantpro-bff:e2e
          load: true
          cache-from: type=gha,scope=e2e-bff
          cache-to: type=gha,scope=e2e-bff,mode=max
      # Builds both SPAs, generates this run's secrets and keys (deploy/e2e/.run/restaurantpro-e2e/), registers them in
      # Keycloak, starts the images built above and waits until every service is healthy.
      - run: pnpm e2e:stack:up
        env:
          E2E_SKIP_IMAGE_BUILD: "1"
      # The smoke tests through the real origins, the BackOffice sign-in with OTP and the origin routing; the global
      # setup seeds a new tenant, administrator, waiter and catalog for this run.
      - run: pnpm e2e:stack
      - name: Stack logs
        if: failure()
        run: ../deploy/e2e/stack.sh logs --no-color > e2e-stack.log 2>&1 || true
      # The traces hold this run's throwaway admin password and cookies: fine only because the stack is ephemeral
      # (destroyed below). Never point this job at a persistent environment (frontend/README.md).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-stack.log
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: pnpm e2e:stack:down
