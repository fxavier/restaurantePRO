# Frontend CI (ADR 0043): lint, type check, unit and component tests, and build for every package and app, plus the
# OpenAPI snapshot drift check (ADR 0042), on every pull request that touches the frontend or the backend (whose
# controllers and DTOs are the contract the snapshot records).
#
# Then the Playwright end-to-end job against the real stack (deploy/e2e: PostgreSQL, Keycloak, the backend, the BFF and
# both SPAs behind their origins, ADR 0041), with its own seeded data per run.
# The backend's own test suite is not run here; a backend CI is a separate decision (ADR 0043).
name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "bff/**"
      - "deploy/e2e/**"
      - "deploy/keycloak/**"
      - "deploy/keycloak-*.sh"
      - "deploy/Dockerfile*"
      - "deploy/postgres/provision*"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "bff/**"
      - "deploy/e2e/**"
      - "deploy/keycloak/**"
      - "deploy/keycloak-*.sh"
      - "deploy/Dockerfile*"
      - "deploy/postgres/provision*"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version pinned in frontend/package.json ("packageManager").
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Also generates packages/api-client/src/schema.d.ts from the committed snapshot (its "prepare" script).
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  openapi-snapshot:
    name: OpenAPI snapshot drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Fails when frontend/packages/api-client/openapi.json differs from what the backend code produces, naming the
      # first differing line. Needs Docker for the Testcontainers database, which the hosted runner provides.
      - run: ./mvnw -B -ntp test -Dtest=OpenApiSnapshotTest

  e2e:
    name: end-to-end (real stack)
    needs: checks
    runs-on: ubuntu-latest # Docker and Compose v2 are on the hosted runner
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Builds both SPAs and the backend and BFF images, generates this run's secrets and keys (deploy/e2e/.run/),
      # registers them in Keycloak and waits until every service is healthy.
      - run: pnpm e2e:stack:up
      # The smoke tests through the real origins, the BackOffice sign-in with OTP and the origin routing; the global
      # setup seeds a new tenant, administrator, waiter and catalog for this run.
      - run: pnpm e2e:stack
      - name: Stack logs
        if: failure()
        run: ../deploy/e2e/stack.sh logs --no-color > e2e-stack.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-stack.log
          retention-days: 14
      - name: Stop the stack
        if: always()
        run: pnpm e2e:stack:down
