# Frontend CI (ADR 0043): lint, type check, unit and component tests, and build for every package and app, plus the
# OpenAPI snapshot drift check (ADR 0042), on every pull request that touches the frontend or the backend (whose
# controllers and DTOs are the contract the snapshot records).
#
# The Playwright end-to-end job against the compose stack is added by issue 05 (docs/issues/frontend-r1/05-...).
# The backend's own test suite is not run here; a backend CI is a separate decision (ADR 0043).
name: frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version pinned in frontend/package.json ("packageManager").
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      # Also generates packages/api-client/src/schema.d.ts from the committed snapshot (its "prepare" script).
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  openapi-snapshot:
    name: OpenAPI snapshot drift
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Fails when frontend/packages/api-client/openapi.json differs from what the backend code produces, naming the
      # first differing line. Needs Docker for the Testcontainers database, which the hosted runner provides.
      - run: ./mvnw -B -ntp test -Dtest=OpenApiSnapshotTest
