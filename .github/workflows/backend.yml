# Backend CI (ADR 0043, amended 2026-11-23): the backend's full test suite, `./mvnw verify` (unit, Spring Modulith,
# Testcontainers PostgreSQL and Keycloak integration tests), on every pull request and push to main that touches the
# backend or the deploy files and OpenAPI snapshot its tests read. The frontend workflow runs only the OpenAPI snapshot test of this suite.
name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      # files the suite reads from outside backend/ (pom.xml test resources and the tests' own file reads)
      - "deploy/keycloak/**"
      - "deploy/postgres/**"
      - "deploy/monitoring/**"
      - "frontend/packages/api-client/openapi.json"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      # files the suite reads from outside backend/ (pom.xml test resources and the tests' own file reads)
      - "deploy/keycloak/**"
      - "deploy/postgres/**"
      - "deploy/monitoring/**"
      - "frontend/packages/api-client/openapi.json"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest # Docker for Testcontainers is on the hosted runner
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    # Every action is pinned by its full commit SHA (FE-F05), the same pins as the frontend workflow.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # The Maven distribution the wrapper downloads is not in setup-java's cache (FE-F31).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}
      - run: ./mvnw -B -ntp verify
