spring:
  application:
    name: backend
  task:
    scheduling:
      pool:
        # The scheduled jobs (sweepers, in-doubt resolver, event recovery, heartbeats) share this pool: a job that
        # waits on a payment provider must not stall the others (S30 review).
        size: 4
  autoconfigure:
    # No in-memory user with a generated password (spec §10). Identity (S2) owns authentication.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # Dev defaults match backend/compose.yaml. The password is never committed (spec §10):
    # export RESTAURANTPRO_DB_PASSWORD before running. Tests use Testcontainers (@ServiceConnection).
    url: ${RESTAURANTPRO_DB_URL:jdbc:postgresql://localhost:5432/restaurantpro}
    username: ${RESTAURANTPRO_DB_USERNAME:restaurantpro}
    password: ${RESTAURANTPRO_DB_PASSWORD:}
    hikari:
      # D40: 10 POS terminals (spec §12); approver verification commits on its own connection before the use case.
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (D5); Hibernate only checks entities against it.
      ddl-auto: validate
  flyway:
    # Scanned recursively: db/migration/<module>/V<block>__<module>_<what>.sql (D5 version blocks).
    locations: classpath:db/migration
    # ADR 0001 (amended 2026-11-13): one version block per module, so a release adds versions below the head of an
    # installed database (e.g. identity V3013 under reporting V14005). Without out-of-order, validate-on-migrate
    # rejects them as ignored and the upgrade cannot start (FlywayUpgradeTest).
    out-of-order: true
  modulith:
    events:
      # D19 / spec §7: deliver again, at startup, every publication whose listener did not complete
      # (crash or failure). Safe because there is one backend instance per installation and listeners
      # are idempotent. Default is false in Spring Modulith 2.1.
      republish-outstanding-events-on-restart: true
      staleness:
        # D88: Modulith resubmits only a publication that is not already RESUBMITTED. One left RESUBMITTED (a crash
        # between the resubmission and its delivery) is marked FAILED after this, so the recovery job retries it.
        resubmitted: PT10M
  session:
    jdbc:
      table-name: shared.spring_session
      initialize-schema: never
  data:
    web:
      pageable:
        max-page-size: 200 # D23
  servlet:
    multipart:
      # PRD S31: a provider statement upload (canonical CSV, at most 50 000 lines) is the only multipart request
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  # D10: schemas are named by their fully qualified class name; by simple name, records of the same name in two
  # modules (customers and delivery AddressRequest, the nested Line records) merge into one wrong schema.
  use-fqn: true
  swagger-ui:
    # Swagger UI echoes the XSRF-TOKEN cookie in X-XSRF-TOKEN, so "Try it out" works for writes (CSRF is on, D26).
    csrf:
      enabled: true

server:
  servlet:
    session:
      cookie:
        # D25 / spec §10
        secure: true
        http-only: true
        same-site: lax

logging:
  structured:
    # D33: one JSON object per line (Elastic Common Schema); MDC keys such as correlationId are included.
    format:
      console: ecs

management:
  server:
    port: ${RESTAURANTPRO_MANAGEMENT_PORT:8081}
  # Component statuses only (no details), e.g. fiscal: NON_CERTIFIED (D54). The management port is not reachable
  # from the LAN (D33).
  endpoint:
    health:
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

restaurantpro:
  idempotency:
    # D47.4: completed Idempotency-Key records are deleted after this period (daily job, 03:30 server time).
    retention: P90D
    retention-cron: "0 30 3 * * *"
    # D63: lease of an executeSteps claim; a duplicate gets 409 while it is live, and may take the claim over after.
    step-lease: PT30S
  notifications:
    # D60: SSE comment heartbeat on /api/v1/pos/notifications.
    heartbeat: PT25S
  events:
    # D88: the recovery job resubmits, every resubmit-interval, each incomplete publication untouched (since its
    # publication or last resubmission) for resubmit-older-than, until it has had max-attempts attempts (Modulith
    # counts the first delivery). Completed publications are deleted after completed-retention (daily, purge-cron).
    resubmit-interval: PT1M
    resubmit-older-than: PT5M
    max-attempts: 10
    completed-retention: P30D
    purge-cron: "0 45 3 * * *"
  # R5: the environment names below are frozen by the R5 PRD (deploy/compose.yaml, S62). Spring's relaxed binding
  # would not map them (RESTAURANTPRO_MFA_MODE is not restaurantpro.security.mfa.mode), so each is bound explicitly.
  # FrozenConfigurationNamesTest proves every one. An empty value means "not set".
  security:
    mfa:
      # D138/D142: OFF, SENSITIVE or ALL_BACKOFFICE (deploy/.env.example sets SENSITIVE, P52)
      mode: ${RESTAURANTPRO_MFA_MODE:OFF}
      step-up-max-age: ${RESTAURANTPRO_MFA_STEP_UP_MAX_AGE:PT15M}
      # file of the secret mfa_key; required unless the mode is OFF
      key-file: ${RESTAURANTPRO_MFA_KEY_FILE:}
    # D140: comma-separated CIDRs of the restaurant's LAN (a VPN pool counts as remote unless listed)
    lan-cidrs: ${RESTAURANTPRO_LAN_CIDRS:}
    oidc:
      # D144/P55: one optional OpenID Connect provider; off unless enabled
      enabled: ${RESTAURANTPRO_OIDC_ENABLED:false}
      issuer-uri: ${RESTAURANTPRO_OIDC_ISSUER_URI:}
      client-id: ${RESTAURANTPRO_OIDC_CLIENT_ID:}
      client-secret-file: ${RESTAURANTPRO_OIDC_CLIENT_SECRET_FILE:}
      display-name: ${RESTAURANTPRO_OIDC_DISPLAY_NAME:SSO}
      scopes: ${RESTAURANTPRO_OIDC_SCOPES:openid}
      trust-idp-mfa: ${RESTAURANTPRO_OIDC_TRUST_IDP_MFA:false}
      post-login-uri: ${RESTAURANTPRO_OIDC_POST_LOGIN_URI:/backoffice/}
  alerts:
    # D151: the backup status file written by deploy/verify-backups.sh (Compose mounts it read-only at
    # /run/restaurantpro/status/backup-status.json). Empty = no backup alerts (developer stacks).
    backup-status-file: ${RESTAURANTPRO_ALERTS_BACKUP_STATUS_FILE:}
    # D150 CASH_DISCREPANCY: a closing counts when its Σ |difference| exceeds this amount (0 = any difference)
    cash-difference-threshold: ${RESTAURANTPRO_ALERTS_CASH_DIFFERENCE_THRESHOLD:0}
  metrics:
    # D152: file of the Prometheus scrape token (secret metrics_token). Empty = /actuator/prometheus needs a
    # SYSTEM_MONITOR session, as every other Actuator endpoint.
    token-file: ${RESTAURANTPRO_METRICS_TOKEN_FILE:}
