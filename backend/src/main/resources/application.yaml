spring:
  application:
    name: backend
  task:
    scheduling:
      pool:
        # The scheduled jobs (sweepers, in-doubt resolver, event recovery, heartbeats) share this pool: a job that
        # waits on a payment provider must not stall the others (S30 review).
        size: 4
  autoconfigure:
    # No in-memory user with a generated password (spec §10). Identity (S2) owns authentication.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # Dev defaults match backend/compose.yaml. The password is never committed (spec §10):
    # export RESTAURANTPRO_DB_PASSWORD before running. Tests use Testcontainers (TestcontainersConfiguration).
    # ADR 0039 (D163): the pool is the application role, which owns nothing and is bound by row-level security; the
    # superuser never connects from the backend (StoreScopeStartupCheck refuses it).
    url: ${RESTAURANTPRO_DB_URL:jdbc:postgresql://localhost:5432/restaurantpro}
    username: ${RESTAURANTPRO_DB_USERNAME:restaurantpro_app}
    password: ${RESTAURANTPRO_DB_PASSWORD:}
    hikari:
      # D40: 10 POS terminals (spec §12); approver verification commits on its own connection before the use case.
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (D5); Hibernate only checks entities against it.
      ddl-auto: validate
  flyway:
    # D163: migrations run as the owner of every application object (BYPASSRLS), on their own connection; the
    # password comes from RESTAURANTPRO_FLYWAY_PASSWORD_FILE in deploy/backend-entrypoint.sh.
    user: ${RESTAURANTPRO_FLYWAY_USERNAME:restaurantpro_owner}
    password: ${RESTAURANTPRO_FLYWAY_PASSWORD:}
    # Scanned recursively: db/migration/<module>/V<block>__<module>_<what>.sql (D5 version blocks).
    locations: classpath:db/migration
    # ADR 0001 (amended 2026-11-13): one version block per module, so a release adds versions below the head of an
    # installed database (e.g. identity V3013 under reporting V14005). Without out-of-order, validate-on-migrate
    # rejects them as ignored and the upgrade cannot start (FlywayUpgradeTest).
    out-of-order: true
  modulith:
    events:
      # D19 / spec §7: deliver again, at startup, every publication whose listener did not complete
      # (crash or failure). Safe because there is one backend instance per installation and listeners
      # are idempotent. Default is false in Spring Modulith 2.1.
      republish-outstanding-events-on-restart: true
      staleness:
        # D88: Modulith resubmits only a publication that is not already RESUBMITTED. One left RESUBMITTED (a crash
        # between the resubmission and its delivery) is marked FAILED after this, so the recovery job retries it.
        resubmitted: PT10M
  data:
    web:
      pageable:
        max-page-size: 200 # D23
  servlet:
    multipart:
      # PRD S31: a provider statement upload (canonical CSV, at most 50 000 lines) is the only multipart request
      max-file-size: 5MB
      max-request-size: 6MB

springdoc:
  # D10: schemas are named by their fully qualified class name; by simple name, records of the same name in two
  # modules (customers and delivery AddressRequest, the nested Line records) merge into one wrong schema.
  use-fqn: true

logging:
  structured:
    # D33: one JSON object per line (Elastic Common Schema); MDC keys such as correlationId are included.
    format:
      console: ecs

management:
  server:
    port: ${RESTAURANTPRO_MANAGEMENT_PORT:8081}
  # Component statuses only (no details), e.g. fiscal: NON_CERTIFIED (D54). The management port is not reachable
  # from the LAN (D33).
  endpoint:
    health:
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

restaurantpro:
  store-scope:
    # D170: ENFORCE, or PERMISSIVE in an emergency (every checkout is all stores; logged, alerted and audited at
    # startup; restore with a restart on ENFORCE). Runbook in deploy/README.md; deliberately not in .env.example.
    enforcement: ${RESTAURANTPRO_STORE_SCOPE_ENFORCEMENT:ENFORCE}
  idempotency:
    # D47.4: completed Idempotency-Key records are deleted after this period (daily job, 03:30 server time).
    retention: P90D
    retention-cron: "0 30 3 * * *"
    # D63: lease of an executeSteps claim; a duplicate gets 409 while it is live, and may take the claim over after.
    step-lease: PT30S
  notifications:
    # D60: SSE comment heartbeat on /api/v1/pos/notifications.
    heartbeat: PT25S
  notify:
    # R6 (D185/D188): the change-notice LISTEN connection's own JDBC URL, direct to PostgreSQL past a transaction-mode
    # pooler (PgBouncer delivers nothing to a LISTEN); empty = the datasource URL. Credentials: the pool's role.
    listen-url: ${RESTAURANTPRO_NOTIFY_LISTEN_URL:}
  events:
    # D88: the recovery job resubmits, every resubmit-interval, each incomplete publication untouched (since its
    # publication or last resubmission) for resubmit-older-than, until it has had max-attempts attempts (Modulith
    # counts the first delivery). Completed publications are deleted after completed-retention (daily, purge-cron).
    resubmit-interval: PT1M
    resubmit-older-than: PT5M
    max-attempts: 10
    completed-retention: P30D
    purge-cron: "0 45 3 * * *"
  # R5: the environment names below are frozen by the R5 PRD (deploy/compose.yaml, S62). Spring's relaxed binding
  # would not map them (RESTAURANTPRO_ALERTS_CASH_DIFFERENCE_THRESHOLD is not restaurantpro.alerts.cash-difference-
  # threshold), so each is bound explicitly. FrozenConfigurationNamesTest proves every one. An empty value means
  # "not set". R6 (S72) retired the local MFA, LAN, OIDC and server-session settings: Keycloak signs users in.
  security:
    # R6 (spec "frozen contracts", D176/D184): Keycloak's two realms. Unset issuers make every API call 503
    # IDP_UNAVAILABLE (fail closed, S72); S71 only declares them.
    issuers:
      tenant: ${RESTAURANTPRO_OIDC_TENANT_ISSUER:}
      ops: ${RESTAURANTPRO_OIDC_OPS_ISSUER:}
      # S73/S75: the realm of terminals and print bridges; unset = fail closed
      devices: ${RESTAURANTPRO_OIDC_DEVICES_ISSUER:}
    audience: restaurantpro-api
    clock-skew: PT30S
    step-up-max-age: PT5M
    # FE-F34: connect and read timeout of a fetch of a realm's key set (JWKS); slower = 503 IDP_UNAVAILABLE.
    # Nimbus' 500 ms default lost fetches from a loaded Keycloak.
    jwks-timeout: ${RESTAURANTPRO_JWKS_TIMEOUT:PT2S}
  keycloak:
    # R6 (D181): the tenancy-provisioner service account of the IdentityProviderAdmin adapter (S75); its private key
    # comes from a secret file, never from the environment.
    admin:
      base-url: ${RESTAURANTPRO_KEYCLOAK_ADMIN_BASE_URL:}
      realm: ${RESTAURANTPRO_KEYCLOAK_ADMIN_REALM:restaurantpro}
      client-id: tenancy-provisioner
      key-file: ${RESTAURANTPRO_KEYCLOAK_ADMIN_KEY_FILE:}
    # S73/S75: the device-provisioner service account of the devices realm (pos-*/bridge-* clients); key from a file
    devices-admin:
      base-url: ${RESTAURANTPRO_KEYCLOAK_DEVICES_ADMIN_BASE_URL:}
      realm: restaurantpro-devices
      client-id: device-provisioner
      key-file: ${RESTAURANTPRO_KEYCLOAK_DEVICES_ADMIN_KEY_FILE:}
  pos:
    # G13 (ADR 0041): the POS app's origin (scheme://host[:port], no path), set as the one web origin of every pos-*
    # client so the browser may call the devices realm's token endpoint; bridge-* clients get none. Unset = creating
    # or enrolling a terminal is 503 IDP_UNAVAILABLE (fail closed, as the admin accounts) and a WARN at startup; not an
    # origin, or http:// off localhost/127.0.0.1/[::1] = no start. Lowercased (browsers send it so; FE-F01..F03).
    origin: ${RESTAURANTPRO_POS_ORIGIN:}
  jobs:
    # R6 (D185): a reach-ALL job takes a lease per (job, tenant) for this long (released when its run ends), and handles
    # at most this many items per tenant per tick (fairness).
    lease-ttl: PT2M
    batch-per-tenant: 100
  alerts:
    # D151: the backup status file written by deploy/verify-backups.sh (Compose mounts it read-only at
    # /run/restaurantpro/status/backup-status.json). Empty = no backup alerts (developer stacks).
    backup-status-file: ${RESTAURANTPRO_ALERTS_BACKUP_STATUS_FILE:}
    # D150 CASH_DISCREPANCY: a closing counts when its Σ |difference| exceeds this amount (0 = any difference)
    cash-difference-threshold: ${RESTAURANTPRO_ALERTS_CASH_DIFFERENCE_THRESHOLD:0}
  metrics:
    # D152: file of the Prometheus scrape token (secret metrics_token). Empty = /actuator/prometheus needs a
    # SYSTEM_MONITOR session, as every other Actuator endpoint.
    token-file: ${RESTAURANTPRO_METRICS_TOKEN_FILE:}
