# D171: the store-scope fixture fallback. StoreScopeFixtureExtension marks the JUnit thread during each test class, so
# fixture SQL with no actor sees every store, while listeners, schedulers and executors keep production semantics.
junit.jupiter.extensions.autodetection.enabled=true
junit.jupiter.extensions.autodetection.include=com.xavier.backend.access.StoreScopeFixtureExtension
