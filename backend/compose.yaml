# Local development database only (PRD S0). The deploy stack lives in deploy/ (S5).
# Usage (from backend/): ./run-local.sh, which sets dev defaults for the three passwords below. By hand:
#   export RESTAURANTPRO_DEV_SUPERUSER_PASSWORD=<choose> RESTAURANTPRO_FLYWAY_PASSWORD=<choose> RESTAURANTPRO_DB_PASSWORD=<choose>
#   docker compose up -d --wait
# ADR 0039 (D163): as in deploy/, db-provision runs deploy/postgres/provision-roles.sql at every up, so the backend runs
# as restaurantpro_app (pool, RESTAURANTPRO_DB_PASSWORD) and restaurantpro_owner (Flyway, RESTAURANTPRO_FLYWAY_PASSWORD),
# never as the superuser, and row-level security is on locally too. The passwords come from your environment and are
# never committed (spec §10).
# R6 (D175, S75): Keycloak 26.x with its own PostgreSQL (never the application's database), the three realms of
# deploy/keycloak imported at first start, and Mailpit to catch its emails (invitations) at http://localhost:8025.
# Keycloak: http://localhost:8180 (admin console as RESTAURANTPRO_DEV_KEYCLOAK_ADMIN_PASSWORD's admin). The
# provisioners' keys are generated and registered by ../deploy/keycloak-provisioners.sh (run-local.sh does it).
services:
  postgres:
    image: postgres:18.6-alpine # same image as TestcontainersConfiguration (D4)
    environment:
      POSTGRES_DB: restaurantpro
      POSTGRES_USER: restaurantpro
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5432:5432" # never exposed beyond localhost (spec §10)
    volumes:
      - restaurantpro-dev-db:/var/lib/postgresql
    healthcheck:
      # TCP, not the socket: during first-time init the image runs a socket-only server.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U restaurantpro -d restaurantpro"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-provision:
    image: postgres:18.6-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bash", "/etc/restaurantpro/provision.sh"]
    # The image declares a data volume; a tmpfs there keeps this one-shot from leaving an anonymous volume behind.
    tmpfs:
      - /var/lib/postgresql
    environment:
      PGHOST: postgres
    secrets:
      - db_password
      - db_owner_password
      - db_app_password
    volumes:
      - ../deploy/postgres/provision.sh:/etc/restaurantpro/provision.sh:ro
      - ../deploy/postgres/provision-roles.sql:/etc/restaurantpro/provision-roles.sql:ro

  keycloak-db:
    image: postgres:18.6-alpine # Keycloak's own database (D175): same pin, separate server and volume
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - keycloak_db_password
    volumes:
      - restaurantpro-dev-keycloak-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0 # the pin of SharedKeycloak (D175: minor upgrades are a planned change)
    depends_on:
      keycloak-db:
        condition: service_healthy
    # Keycloak reads its passwords from the environment only; they are taken from the secret files here, so they
    # never appear in this file, the process list of the host or `docker inspect`.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        export KC_DB_PASSWORD="$$(cat /run/secrets/keycloak_db_password)"
        KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)" &&
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8180
    secrets:
      - keycloak_db_password
      - keycloak_admin_password
    ports:
      - "127.0.0.1:8180:8080" # localhost only (spec §10)
    volumes:
      - ../deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # the management port answers /health/ready once the realms are imported
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27 # catches Keycloak's emails in development; nothing leaves the machine
    ports:
      - "127.0.0.1:8025:8025"

secrets:
  keycloak_db_password:
    environment: RESTAURANTPRO_DEV_KEYCLOAK_DB_PASSWORD
  keycloak_admin_password:
    environment: RESTAURANTPRO_DEV_KEYCLOAK_ADMIN_PASSWORD
  db_password: # the superuser, which only db-provision and you (psql) use
    environment: RESTAURANTPRO_DEV_SUPERUSER_PASSWORD
  db_owner_password:
    environment: RESTAURANTPRO_FLYWAY_PASSWORD
  db_app_password:
    environment: RESTAURANTPRO_DB_PASSWORD

volumes:
  restaurantpro-dev-db:
  restaurantpro-dev-keycloak-db:
