# restaurantPRO end-to-end stack (frontend R1 ticket 05, ADR 0041, ADR 0043). Throwaway, test data only, loopback only.
# Do not run it by hand: deploy/e2e/stack.sh up generates the secrets and keys in deploy/e2e/.run/ (git-ignored),
# starts the services in order, registers the keys in Keycloak and builds the two SPAs; stack.sh down removes it all.
#
# Origins (each app same-origin with its API, ADR 0041):
#   http://localhost:14174  BackOffice SPA + BFF (/api/v1/backoffice/**, /api/v1/auth/**, /bff/**, /oauth2/**, /login/**)
#   http://localhost:14173  POS SPA + backend (/api/v1/pos/**, /api/v1/auth/** only; any other /api path is 404)
#   http://localhost:18180  Keycloak (dev realms of deploy/keycloak), the issuer the browser and the services share
#   http://localhost:18080  the backend itself, for the seed script only (platform onboarding is not on either origin)
#
# One network namespace. Every service joins the namespace of `net` (network_mode: service:net), so `localhost:<port>`
# means the same server to the browser, the seed scripts on the host and the services. Keycloak announces one issuer,
# http://localhost:18180/realms/..., which the backend and the BFF check in every token and the BFF resolves by
# discovery; with a service name (http://keycloak:8080) the browser could not reach it, and with two hostnames the
# issuer check fails. It also keeps the seed's loopback-only guard strict (it runs on the host). The cost: the ports
# inside the namespace must not clash, so the Keycloak database is Keycloak's own dev-file store, not a second
# PostgreSQL on 5432.
#
# Reuses the dev and deploy pieces: the postgres:18.6-alpine pin and deploy/postgres/provision.sh (the backend runs as
# restaurantpro_app, never the superuser, ADR 0039), the Keycloak 26.8.0 pin with the realms imported at start, the
# backend image of deploy/Dockerfile, Mailpit for the onboarding invitation, and Caddy (the deploy stack's proxy).
name: restaurantpro-e2e

services:
  # Holds the network namespace and the published ports; does nothing else.
  net:
    image: caddy:2.11.7-alpine
    entrypoint: ["sleep", "infinity"]
    init: true
    ports:
      - "127.0.0.1:14173:14173" # POS origin
      - "127.0.0.1:14174:14174" # BackOffice origin
      - "127.0.0.1:18180:18180" # Keycloak
      - "127.0.0.1:18080:8080" # backend, for the seed scripts
      - "127.0.0.1:18025:8025" # Mailpit UI (the onboarding invitations), for debugging

  postgres:
    image: postgres:18.6-alpine # D4, as backend/compose.yaml and the Testcontainers tests
    network_mode: service:net
    depends_on: [net]
    environment:
      POSTGRES_DB: restaurantpro
      POSTGRES_USER: restaurantpro
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    tmpfs:
      - /var/lib/postgresql # throwaway: every stack starts empty
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U restaurantpro -d restaurantpro"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-provision:
    image: postgres:18.6-alpine
    network_mode: service:net
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["bash", "/etc/restaurantpro/provision.sh"]
    tmpfs:
      - /var/lib/postgresql
    environment:
      PGHOST: 127.0.0.1
    secrets:
      - db_password
      - db_owner_password
      - db_app_password
    volumes:
      - ../postgres/provision.sh:/etc/restaurantpro/provision.sh:ro
      - ../postgres/provision-roles.sql:/etc/restaurantpro/provision-roles.sql:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0 # the pin of backend/compose.yaml and SharedKeycloak
    network_mode: service:net
    depends_on: [net]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/keycloak_admin_password)" &&
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "18180"
      KC_HOSTNAME: http://localhost:18180
    secrets:
      - keycloak_admin_password
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  mailpit:
    image: axllent/mailpit:v1.27 # catches the onboarding invitation; nothing leaves the machine
    network_mode: service:net
    depends_on: [net]

  backend:
    build:
      context: ../../backend
      dockerfile: ../deploy/Dockerfile
      additional_contexts:
        deploy: ..
    image: restaurantpro-backend:e2e
    network_mode: service:net
    depends_on:
      postgres:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    environment:
      RESTAURANTPRO_DB_URL: jdbc:postgresql://127.0.0.1:5432/restaurantpro
      RESTAURANTPRO_DB_USERNAME: restaurantpro_app
      RESTAURANTPRO_DB_PASSWORD_FILE: /run/secrets/db_app_password
      RESTAURANTPRO_FLYWAY_USERNAME: restaurantpro_owner
      RESTAURANTPRO_FLYWAY_PASSWORD_FILE: /run/secrets/db_owner_password
      RESTAURANTPRO_MANAGEMENT_PORT: "8081"
      RESTAURANTPRO_FISCAL_ALLOW_NON_CERTIFIED: "true" # test data only, as backend/run-local.sh
      RESTAURANTPRO_OIDC_TENANT_ISSUER: http://localhost:18180/realms/restaurantpro
      RESTAURANTPRO_OIDC_OPS_ISSUER: http://localhost:18180/realms/restaurantpro-ops
      RESTAURANTPRO_OIDC_DEVICES_ISSUER: http://localhost:18180/realms/restaurantpro-devices
      RESTAURANTPRO_KEYCLOAK_ADMIN_BASE_URL: http://localhost:18180
      RESTAURANTPRO_KEYCLOAK_ADMIN_KEY_FILE: /run/secrets/tenancy_provisioner_key
      RESTAURANTPRO_KEYCLOAK_DEVICES_ADMIN_BASE_URL: http://localhost:18180
      RESTAURANTPRO_KEYCLOAK_DEVICES_ADMIN_KEY_FILE: /run/secrets/device_provisioner_key
      RESTAURANTPRO_POS_ORIGIN: http://localhost:14173 # G13: web origin of the pos-* clients
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    secrets:
      - db_owner_password
      - db_app_password
      - tenancy_provisioner_key
      - device_provisioner_key
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  bff:
    build:
      context: ../../bff
      dockerfile: ../deploy/Dockerfile.bff
    image: restaurantpro-bff:e2e
    network_mode: service:net
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      RESTAURANTPRO_OIDC_TENANT_ISSUER: http://localhost:18180/realms/restaurantpro
      RESTAURANTPRO_BACKEND_URL: http://localhost:8080
      RESTAURANTPRO_BFF_CLIENT_KEY_FILE: /run/secrets/bff_client_key
      # No SERVER_SSL_*: plain HTTP behind Caddy on http://localhost:14174, whose Host the BFF builds its redirect URI
      # from; Chromium accepts the Secure __Host- cookies on http://localhost (deploy/keycloak/README.md, G15).
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=30
    secrets:
      - bff_client_key
    healthcheck:
      # Any HTTP answer (the BFF answers 403 to every path it does not serve) means it is up.
      test: ["CMD-SHELL", "wget -q -S -O /dev/null http://127.0.0.1:8443/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 15s

  caddy:
    image: caddy:2.11.7-alpine # the deploy stack's pin
    network_mode: service:net
    depends_on: [net]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../frontend/apps/pos/dist:/srv/pos:ro
      - ../../frontend/apps/backoffice/dist:/srv/backoffice:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:14173/ && wget -q -O /dev/null http://127.0.0.1:14174/"]
      interval: 3s
      timeout: 3s
      retries: 20

# Written by stack.sh into .run/ (a 0700 directory; the files are 0644 because the containers read them as their own
# non-root users). Fresh on every `stack.sh up` after a `down`.
secrets:
  db_password:
    file: ./.run/db_password
  db_owner_password:
    file: ./.run/db_owner_password
  db_app_password:
    file: ./.run/db_app_password
  keycloak_admin_password:
    file: ./.run/keycloak_admin_password
  tenancy_provisioner_key:
    file: ./.run/keys/tenancy-provisioner.pem
  device_provisioner_key:
    file: ./.run/keys/device-provisioner.pem
  bff_client_key:
    file: ./.run/keys/backoffice-bff.jwk
