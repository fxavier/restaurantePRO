# The BackOffice sign-in in the app's Stitch dark theme (docs/design/DESIGN.md): keycloak.v2's templates and forms,
# so TOTP, step-up, required actions and password reset keep working; only the styling and the Portuguese texts change.
parent=keycloak.v2
import=common/keycloak
# A child theme's `styles` replaces its parent's: keycloak.v2's own sheet first, then ours.
styles=css/styles.css css/restaurantpro.css
locales=pt
scripts=js/restaurantpro.js
