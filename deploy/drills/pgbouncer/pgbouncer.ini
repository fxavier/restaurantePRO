; PgBouncer for restaurantPRO's application pool (D178, D188): transaction pooling. Correct only because the backend
; binds the tenant and store scope with set_config(..., true) at every transaction begin (SET LOCAL semantics) and
; never sets anything session-level; PgBouncerTransactionModeTest proves it (deploy/drills/pgbouncer/README.md).
; The application role only: Flyway (restaurantpro_owner) and the ChangeNotifier LISTEN connection connect to
; PostgreSQL directly (LISTEN does not survive transaction pooling).
[databases]
restaurantpro = host=postgres port=5432 dbname=restaurantpro

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; per (database, user): the backend instances' Hikari pools share these server connections
default_pool_size = 20
max_client_conn = 400
; PgBouncer >= 1.21 tracks protocol-level prepared statements in transaction mode (pgjdbc prepares after 5 uses)
max_prepared_statements = 200
; pgjdbc sends extra_float_digits at startup
ignore_startup_parameters = extra_float_digits
; transaction mode resets nothing between clients: nothing is session-level, so nothing needs resetting
server_reset_query =
