# restaurantPRO — one stack per company installation (spec §2, §11; D32).
#   cp .env.example .env   # fill in
#   create secrets/db_password and secrets/admin_initial_password (README.md, "First install")
#   docker compose up -d --build
# PostgreSQL and the backend sit on an internal network with no published ports; only Caddy
# (HTTPS, tls internal) is reachable from the LAN.
name: restaurantpro

x-logging: &logging # spec §11: log rotation
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    # D98: the D4 pin (postgres:18.6-alpine, as backend/compose.yaml and the Testcontainers tests) plus a
    # pinned age, so WAL is encrypted before it reaches the pg-wal-archive volume.
    build: ./postgres
    image: restaurantpro-postgres:18.6-r1
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurantpro
      POSTGRES_USER: restaurantpro
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # D98: production unless .env says test (developer stacks only). Read by the preflight and the archive_command.
      RESTAURANTPRO_ENVIRONMENT: ${RESTAURANTPRO_ENVIRONMENT:-production}
    # D90, spec §11 (RPO 15 min): continuous WAL archiving into the pg-wal-archive volume. archive_timeout
    # forces a segment switch at least every 5 minutes when anything was written, so at most 5 minutes of
    # commits are not yet archived. The wrapper first runs the D98 preflight (in production: no start
    # without two backup recipients), then makes the archive directory writable by the postgres user only
    # (a new named volume is root-owned), then runs the image's own entrypoint.
    entrypoint:
      - sh
      - -c
      - bash /etc/restaurantpro/preflight.sh && mkdir -p /wal-archive && chown postgres:postgres /wal-archive && chmod 700 /wal-archive && exec docker-entrypoint.sh "$$@"
      - --
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=sh /etc/restaurantpro/archive-wal.sh %p %f
      - -c
      - archive_timeout=300
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql
      - pg-wal-archive:/wal-archive
      - ./postgres/archive-wal.sh:/etc/restaurantpro/archive-wal.sh:ro
      - ./postgres/preflight.sh:/etc/restaurantpro/preflight.sh:ro
      - ./lib/common.sh:/etc/restaurantpro/common.sh:ro
      # Public keys only (D98): the operational and the recovery recipient. A missing file is an error, never
      # an empty directory. Developer stacks in test mode may set BACKUP_AGE_RECIPIENTS_FILE=/dev/null.
      - type: bind
        source: ${BACKUP_AGE_RECIPIENTS_FILE:-./backup-recipients.txt}
        target: /etc/restaurantpro/backup-recipients.txt
        read_only: true
        bind:
          create_host_path: false
    networks:
      - internal
    healthcheck:
      # TCP, not the socket: during first-time init the image runs a socket-only server.
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U restaurantpro -d restaurantpro"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile
      additional_contexts:
        deploy: .
    image: restaurantpro-backend:${RESTAURANTPRO_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RESTAURANTPRO_DB_URL: jdbc:postgresql://postgres:5432/restaurantpro
      RESTAURANTPRO_DB_USERNAME: restaurantpro
      RESTAURANTPRO_DB_PASSWORD_FILE: /run/secrets/db_password # read by backend-entrypoint.sh
      RESTAURANTPRO_MANAGEMENT_PORT: "8081"
      # Caddy terminates TLS; trust its X-Forwarded-* headers (it is on a private Docker network).
      SERVER_FORWARD_HEADERS_STRATEGY: native
      JAVA_TOOL_OPTIONS: ${RESTAURANTPRO_JAVA_OPTS:--XX:MaxRAMPercentage=75}
      # D30: consumed once, at the first start against an empty database.
      RESTAURANTPRO_BOOTSTRAP_COMPANY_NAME: ${RESTAURANTPRO_BOOTSTRAP_COMPANY_NAME:?set in .env}
      RESTAURANTPRO_BOOTSTRAP_COMPANY_TAX_ID: ${RESTAURANTPRO_BOOTSTRAP_COMPANY_TAX_ID:?set in .env}
      RESTAURANTPRO_BOOTSTRAP_COMPANY_COUNTRY: ${RESTAURANTPRO_BOOTSTRAP_COMPANY_COUNTRY:?set in .env}
      RESTAURANTPRO_BOOTSTRAP_COMPANY_CURRENCY: ${RESTAURANTPRO_BOOTSTRAP_COMPANY_CURRENCY:?set in .env}
      RESTAURANTPRO_BOOTSTRAP_ADMIN_USERNAME: ${RESTAURANTPRO_BOOTSTRAP_ADMIN_USERNAME:?set in .env}
      RESTAURANTPRO_BOOTSTRAP_ADMIN_INITIAL_PASSWORD_FILE: /run/secrets/admin_initial_password
      # B4/D54: false by default, so a real install refuses to start with the non-certified fiscal adapter
      # until the operator opts in through .env (pilot only).
      RESTAURANTPRO_FISCAL_ALLOW_NON_CERTIFIED: ${RESTAURANTPRO_FISCAL_ALLOW_NON_CERTIFIED:-false}
      # R4 scheduled jobs; the defaults are the code's (restaurantpro.dining.no-show-interval, P47, and
      # restaurantpro.inventory.reconcile-cron, D113).
      RESTAURANTPRO_DINING_NO_SHOW_INTERVAL: ${RESTAURANTPRO_DINING_NO_SHOW_INTERVAL:-PT1M}
      RESTAURANTPRO_INVENTORY_RECONCILE_CRON: "${RESTAURANTPRO_INVENTORY_RECONCILE_CRON:-0 20 4 * * *}"
    secrets:
      - db_password
      - admin_initial_password
    networks:
      - internal
    healthcheck:
      # Actuator health on the management port (D33); the only actuator endpoint open without login.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging: *logging

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      RESTAURANTPRO_HOSTNAME: ${RESTAURANTPRO_HOSTNAME:?set in .env}
    ports:
      - "${RESTAURANTPRO_HTTPS_PORT:-443}:443"
      - "${RESTAURANTPRO_HTTP_PORT:-80}:80" # redirects to HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # holds the local CA: keep it, or clients must trust a new root
      - caddy-config:/config
    networks:
      - edge
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

secrets:
  db_password:
    file: ./secrets/db_password
  admin_initial_password:
    file: ./secrets/admin_initial_password

networks:
  internal:
    internal: true # no route to the host network or the Internet
  edge: {}

volumes:
  db-data:
  pg-wal-archive: # age-encrypted WAL since the oldest kept base backup (basebackup.sh prunes it; D98)
  caddy-data:
  caddy-config:
